<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="310" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif" role="img" viewBox="0 0 1040 310"><title id="title">AI agent and Jenkins feedback loop</title><desc id="desc">An AI agent proposes a change, Jenkins runs the pipeline in an isolated worker and produces a build result with logs. A failed build sends the logs back to the agent for another attempt. A passing build goes to human review and then to release.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#335061" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arrow-red" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#c0392b" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arrow-green" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2e8b57" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="1040" height="310" fill="#fff"/><rect width="170" height="90" x="20" y="90" fill="#efe9fb" stroke="#6c4ab6" stroke-width="2" rx="12"/><text x="105" y="128" fill="#3d2a6b" font-size="18" font-weight="bold" text-anchor="middle">AI agent</text><text x="105" y="152" fill="#3d2a6b" font-size="14" text-anchor="middle">proposes a change</text><rect width="220" height="110" x="240" y="80" fill="#e6eef3" stroke="#335061" stroke-width="3" rx="12"/><text x="350" y="112" fill="#335061" font-size="18" font-weight="bold" text-anchor="middle">Jenkins pipeline</text><text x="350" y="136" fill="#335061" font-size="14" text-anchor="middle">isolated worker</text><text x="350" y="158" fill="#335061" font-size="14" text-anchor="middle">build · style · tests</text><text x="350" y="178" fill="#335061" font-size="14" text-anchor="middle">security checks</text><rect width="170" height="90" x="510" y="90" fill="#fdf5e6" stroke="#c98a1b" stroke-width="2" rx="12"/><text x="595" y="128" fill="#7a5210" font-size="18" font-weight="bold" text-anchor="middle">Evidence</text><text x="595" y="152" fill="#7a5210" font-size="14" text-anchor="middle">result + logs</text><rect width="140" height="90" x="740" y="90" fill="#eaf6ee" stroke="#2e8b57" stroke-width="2" rx="12"/><text x="810" y="128" fill="#1e5c3a" font-size="18" font-weight="bold" text-anchor="middle">Human</text><text x="810" y="152" fill="#1e5c3a" font-size="18" font-weight="bold" text-anchor="middle">review</text><rect width="100" height="90" x="920" y="90" fill="#2e8b57" stroke="#1e5c3a" stroke-width="2" rx="12"/><text x="970" y="141" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">Release</text><line x1="190" x2="236" y1="135" y2="135" stroke="#335061" stroke-width="2.5" marker-end="url(#arrow)"/><text x="215" y="120" fill="#335061" font-size="12" text-anchor="middle">PR</text><line x1="460" x2="506" y1="135" y2="135" stroke="#335061" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="680" x2="736" y1="135" y2="135" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#arrow-green)"/><text x="708" y="120" fill="#2e8b57" font-size="13" font-weight="bold" text-anchor="middle">green</text><line x1="880" x2="916" y1="135" y2="135" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#arrow-green)"/><path fill="none" stroke="#c0392b" stroke-dasharray="7 5" stroke-width="2.5" marker-end="url(#arrow-red)" d="M595,180 L595,250 L105,250 L105,184"/><text x="350" y="275" fill="#c0392b" font-size="14" font-weight="bold" text-anchor="middle">red: logs go back to the agent, which diagnoses and retries</text><text x="520" y="40" fill="#222" font-size="20" font-weight="bold" text-anchor="middle">Agents propose, Jenkins verifies, humans decide</text></svg>